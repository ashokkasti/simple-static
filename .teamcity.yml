---
parameters:
  env.API_URL: https://app.invisirisk.com
  env.IR_TOKEN: "%IR_TOKEN%"
  env.IR_RUN_ID: "%system.teamcity.build.id%"
  env.IR_BUILD_URL: "%env.BUILD_URL%"
  env.IR_PROJECT: "%system.teamcity.projectName%"
  env.IR_PIPELINE: "%system.teamcity.buildConfName%"
jobs:
  ValidateManifest:
    name: Validate dependency manifest
    steps:
    - type: script
      name: Read application dependencies
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        node -e 'const p = require("./package.json"); console.log(p.name); for (const [name, version] of Object.entries(p.dependencies)) console.log(`${name}: ${version}`)'

        sudo -E pse-data-collector cleanup
    runs-on: Linux-Small
    allow-reuse: false
  QualityChecks:
    name: Mock lint and unit tests
    dependencies:
    - ValidateManifest
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        echo "MOCK: lint frontend, API, and worker sources"
        echo "MOCK: run unit tests and collect coverage"
        mkdir -p reports/quality
        echo "Mock only. No lint or tests executed." > reports/quality/result.txt

        sudo -E pse-data-collector cleanup
    files-publication:
    - path: reports/quality/result.txt
      share-with-jobs: false
      publish-artifact: true
    runs-on: Linux-Small
    allow-reuse: false
  BuildFrontend:
    name: Package frontend example
    dependencies:
    - QualityChecks
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        npm ci --omit=dev --no-audit --no-fund
        mkdir -p dist/frontend
        cp index.html dist/frontend/index.html
        echo "Packaged the existing static frontend"

        sudo -E pse-data-collector cleanup
    files-publication:
    - path: dist/frontend/index.html
      share-with-jobs: true
      publish-artifact: true
    runs-on: Linux-Small
    allow-reuse: false
  BuildApi:
    name: Mock API build
    dependencies:
    - QualityChecks
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        npm ci --omit=dev --no-audit --no-fund
        mkdir -p dist/api
        echo '{"service":"api","mock":true,"stack":["express","pg","zod"]}' > dist/api/service.json

        sudo -E pse-data-collector cleanup
    files-publication:
    - path: dist/api/service.json
      share-with-jobs: true
      publish-artifact: true
    runs-on: Linux-Small
    allow-reuse: false
  BuildWorker:
    name: Mock background worker build
    dependencies:
    - QualityChecks
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        npm ci --omit=dev --no-audit --no-fund
        mkdir -p dist/worker
        echo '{"service":"worker","mock":true,"stack":["bullmq","pg"]}' > dist/worker/service.json

        sudo -E pse-data-collector cleanup
    files-publication:
    - path: dist/worker/service.json
      share-with-jobs: true
      publish-artifact: true
    runs-on: Linux-Small
    allow-reuse: false
  IntegrationChecks:
    name: Mock integration checks
    dependencies:
    - BuildFrontend:
        files:
        - dist/frontend/index.html
    - BuildApi:
        files:
        - dist/api/service.json
    - BuildWorker:
        files:
        - dist/worker/service.json
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        test -f dist/frontend/index.html
        test -f dist/api/service.json
        test -f dist/worker/service.json
        echo "MOCK: exercise frontend -> API -> PostgreSQL -> Redis worker"
        mkdir -p reports/integration
        echo "Artifact presence checked. Application integration tests are mocked." > reports/integration/result.txt

        sudo -E pse-data-collector cleanup
    files-publication:
    - path: reports/integration/result.txt
      share-with-jobs: false
      publish-artifact: true
    runs-on: Linux-Small
    allow-reuse: false
  PackageRelease:
    name: Assemble release archive
    dependencies:
    - BuildFrontend:
        files:
        - dist/frontend/index.html
    - BuildApi:
        files:
        - dist/api/service.json
    - BuildWorker:
        files:
        - dist/worker/service.json
    - IntegrationChecks
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        mkdir -p release
        cp package.json dist/package.json
        tar -czf release/application.tar.gz -C dist frontend api worker package.json

        sudo -E pse-data-collector cleanup
    files-publication:
    - path: release/application.tar.gz
      share-with-jobs: true
      publish-artifact: true
    runs-on: Linux-Small
    allow-reuse: false
  DeployStaging:
    name: Mock staging deployment
    dependencies:
    - PackageRelease:
        files:
        - release/application.tar.gz
    steps:
    - type: script
      script-content: |
        #!/usr/bin/env bash
        set -e
        curl -sSf -H "x-api-key: ${IR_TOKEN}" "${API_URL}/ingestionapi/v1/pse/bootstrap" | sudo -E bash
        . /tmp/ir_envs

        test -s release/application.tar.gz
        tar -tzf release/application.tar.gz
        echo "MOCK: upload release, migrate database, deploy services, and check health"
        echo "No infrastructure was modified."

        sudo -E pse-data-collector cleanup
    runs-on: Linux-Small
    allow-reuse: false
secrets:
  IR_TOKEN: credentialsJSON:56d435cf-5bbc-4091-931a-0b6005e9ac1c
